[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musical-seo"
dynamic = ["version"]
description = "Sifir maliyetli muzik SEO denetim araci — sarki gorunurlugu, SEO karnesi ve zaman serisi"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seyhan Canyakan" }]
keywords = ["music", "seo", "spotify", "deezer", "youtube", "audit", "playlist"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
# Ses profili (Deezer 30sn onizleme analizi). Kurulu degilse playlist
# eslestirme ses katmani olmadan calisir.
audio = ["librosa>=0.10", "soundfile>=0.12", "numpy>=1.24"]
# Curator marketplace HTTP API'si
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["musical-seo[audio,api]", "pytest>=8.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/seyhancanyakan/musical-seo"
Source = "https://github.com/seyhancanyakan/musical-seo"
Issues = "https://github.com/seyhancanyakan/musical-seo/issues"

[project.scripts]
musical-seo = "musical_seo.cli:main"

[tool.setuptools.dynamic]
version = { attr = "musical_seo.__version__" }

[tool.setuptools.packages.find]
include = ["musical_seo*", "marketplace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
